<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Short<span>ly</span></div>
    <div class="badge" id="api-badge"><span class="dot"></span> checking…</div>
  </header>

  <main>
    <section class="hero">
      <h1>Shorten a <span class="accent">link</span></h1>
      <p class="sub">web → api (Flask) → postgres, with a redis-backed worker counting clicks.</p>
    </section>

    <section class="card composer">
      <form id="link-form">
        <input id="link-input" type="url" placeholder="https://example.com/very/long/link" autocomplete="off" />
        <button type="submit">Shorten</button>
      </form>
      <p class="muted" id="form-msg"></p>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="n" id="stat-clicks">–</div>
        <div class="l">total clicks (via worker)</div>
      </div>
    </section>

    <section>
      <h2>Your links</h2>
      <div id="links" class="links"><p class="muted">Loading…</p></div>
    </section>
  </main>

  <footer>shortly · built at __BUILD_TIME__</footer>
  <script src="main.js"></script>
</body>
</html>
